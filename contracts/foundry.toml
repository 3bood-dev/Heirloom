[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

# Throwaway Phase-0 probe contracts live outside src/ so they never ship.
[profile.spikes]
src = "spikes"
out = "out-spikes"
test = "spikes"

[rpc_endpoints]
hedera_testnet = "${JSON_RPC_RELAY_URL}"

[fuzz]
runs = 512
